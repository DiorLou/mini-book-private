name: Build and deploy notebooks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  windows-script-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem scripts -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) > $null
            if ($parseErrors.Count) {
              $failed = $true
              Write-Output $parseErrors
            }
          }
          if ($failed) { exit 1 }
  deploy:
    needs: windows-script-check
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install browser PDF dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
      - name: Test PDF table of contents mapping
        run: node --test scripts/pdf-toc-links.test.cjs
      - name: Build all notebooks and PDFs
        shell: pwsh
        run: ./scripts/build-all.ps1 -PublishDir "${{ runner.temp }}/site"
      - name: Verify PDF sidebar navigation
        run: node scripts/check-pdf-toc.cjs 'american intonation' american-intonation.pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
